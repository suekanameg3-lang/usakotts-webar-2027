<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usakotts MindAR Test</title>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.147.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.147.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

#container {
  width: 100%;
  height: 100%;
  position: fixed;
  inset: 0;
}

#status {
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 10;
  color: white;
  background: rgba(0,0,0,0.7);
  padding: 10px;
  font: 16px sans-serif;
}

/* ブラックアウト用レイヤー */
#fadeOverlay {
  position: fixed;
  inset: 0;
  background: #000;
  opacity: 1;
  pointer-events: none;
  z-index: 15;
}

#startButton {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 20;
  padding: 16px 35px;
  font-size: 22px;
}
</style>
</head>

<body>

<div id="container"></div>
<div id="fadeOverlay"></div>
<div id="status">読み込み中...</div>
<button id="startButton" disabled>読み込み中...</button>

<!-- 春の海 -->
<audio
  id="bgm"
  src="./harunoumi.mp3"
  preload="auto">
</audio>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MindARThree } from "mindar-image-three";

/* =====================================
   HTML要素
===================================== */

const statusText = document.getElementById("status");
const startButton = document.getElementById("startButton");
const fadeOverlay = document.getElementById("fadeOverlay");
const bgm = document.getElementById("bgm");


/* =====================================
   音声設定 (30fps基準)
===================================== */

const FPS = 30;

// SE再生タイミング
const SEI_TIME  = 283 / FPS;
const PA_TIME   = 348 / FPS;
const MEEE_TIME = 382 / FPS;

// パッの追加遅延
const PA_OFFSET = 0.120;

// SE音量倍率
const SEI_GAIN  = 5;
const PA_GAIN   = 10;
const MEEE_GAIN = 3;

// ブラックアウト開始
const BLACK_START = 446 / FPS;

// BGMフェードアウト時間
const BGM_FADE_DURATION = 4.5;


/* =====================================
   Web Audio
===================================== */

const AudioContextClass = window.AudioContext || window.webkitAudioContext;
const audioContext = new AudioContextClass();

// BGM用Gain
const bgmGain = audioContext.createGain();
bgmGain.gain.value = 1;
bgmGain.connect(audioContext.destination);

// HTMLAudioElementをWeb Audioへ接続
const bgmSource = audioContext.createMediaElementSource(bgm);
bgmSource.connect(bgmGain);

// SEバッファ
let seiBuffer = null;
let paBuffer = null;
let meeeBuffer = null;

// 読み込み状態
let audioLoaded = false;
let modelLoaded = false;

// SE再生済みフラグ
let seiPlayed = false;
let paPlayed = false;
let meeePlayed = false;

// BGMの停止予定時刻
let bgmStopAt = null;


/* =====================================
   BGMフェードアウトカーブ
===================================== */

const bgmFadeCurve = new Float32Array([
  1.000, 0.985, 0.950, 0.890, 0.800,
  0.680, 0.530, 0.370, 0.220, 0.110,
  0.045, 0.010, 0.000
]);


/* =====================================
   BGM再生関数
===================================== */

async function startBGM(clipDuration) {
  bgmStopAt = null;
  bgm.pause();
  bgm.currentTime = 0;

  const now = audioContext.currentTime;
  bgmGain.gain.cancelScheduledValues(now);
  bgmGain.gain.setValueAtTime(1, now);

  try {
    await bgm.play();

    const fadeDuration = Math.min(BGM_FADE_DURATION, clipDuration);
    const fadeStart = audioContext.currentTime + Math.max(0, clipDuration - BGM_FADE_DURATION);
    const fadeEnd = fadeStart + fadeDuration;

    bgmGain.gain.setValueAtTime(1, audioContext.currentTime);
    bgmGain.gain.setValueCurveAtTime(bgmFadeCurve, fadeStart, fadeDuration);

    bgmStopAt = fadeEnd;
  } catch (error) {
    console.error("BGM再生エラー:", error);
  }
}


/* =====================================
   SE読み込み・再生
===================================== */

async function loadAudioBuffer(url) {
  const response = await fetch(url);
  if (!response.ok) {
    throw new Error("音声ファイル読み込み失敗: " + url);
  }
  const arrayBuffer = await response.arrayBuffer();
  return await audioContext.decodeAudioData(arrayBuffer);
}

function playSound(buffer, gainValue) {
  if (!buffer) return;

  const source = audioContext.createBufferSource();
  const gain = audioContext.createGain();

  source.buffer = buffer;
  gain.gain.value = gainValue;

  source.connect(gain);
  gain.connect(audioContext.destination);

  source.start(0);
}


/* =====================================
   SEフラグ初期化
===================================== */

function resetSEFlags() {
  seiPlayed = false;
  paPlayed = false;
  meeePlayed = false;
}


/* =====================================
   メイン処理
===================================== */

async function init() {
  try {
    const mindarThree = new MindARThree({
      container: document.querySelector("#container"),
      imageTargetSrc: "./targets.mind",
      maxTrack: 1,
      uiLoading: "no",
      uiScanning: "no"
    });

    const { renderer, scene, camera } = mindarThree;

    /* カメラ設定 */
    camera.near = 0.001;
    camera.far = 1000;
    camera.updateProjectionMatrix();

    /* 環境光・方向光 */
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x666666, 1.0);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(0, 3, 5);
    scene.add(dirLight);

    /* MindARアンカー */
    const anchor = mindarThree.addAnchor(0);
    const loader = new GLTFLoader();
    const clock = new THREE.Clock();

    let mixer = null;
    let action = null;
    let clipDuration = 0;
    let animationElapsed = 0;
    let currentLoopIndex = -1;

    /* GLB読み込み */
    loader.load(
      "./Usakotts_WebAR_1005_PEACH.glb",
      (gltf) => {
        const model = gltf.scene;
        model.position.set(0, 0, 0);
        model.scale.set(0.21, 0.21, 0.21);

        const arRoot = new THREE.Group();
        arRoot.position.set(0, 0.50, 0);
        arRoot.add(model);
        anchor.group.add(arRoot);

        if (gltf.animations.length > 0) {
          const clip = gltf.animations[0];
          clipDuration = clip.duration;

          mixer = new THREE.AnimationMixer(model);
          action = mixer.clipAction(clip);
          action.setLoop(THREE.LoopRepeat, Infinity);
          action.clampWhenFinished = false;
          action.play();
          mixer.setTime(0);
        } else {
          throw new Error("GLBにアニメーションがありません");
        }

        modelLoaded = true;
        checkReady();
      },
      undefined,
      (error) => {
        console.error(error);
        statusText.textContent = "GLB読み込みエラー";
      }
    );

    /* SE読み込み */
    Promise.all([
      loadAudioBuffer("./sei.mp3"),
      loadAudioBuffer("./pa.mp3"),
      loadAudioBuffer("./Usakotts_Meee_Sheep02.mp3")
    ])
    .then((buffers) => {
      seiBuffer = buffers[0];
      paBuffer = buffers[1];
      meeeBuffer = buffers[2];
      audioLoaded = true;
      console.log("SE読み込み完了");
      checkReady();
    })
    .catch((error) => {
      console.error(error);
      statusText.textContent = "SE読み込みエラー";
    });

    function checkReady() {
      if (modelLoaded && audioLoaded) {
        startButton.disabled = false;
        startButton.textContent = "START";
        statusText.textContent = "モデル・音声読み込み完了";
      }
    }

    /* 画像認識メッセージ */
    anchor.onTargetFound = () => {
      if (!animationStarted) {
        statusText.textContent = "画像を認識しました！";
      }
    };

    anchor.onTargetLost = () => {
      if (!animationStarted) {
        statusText.textContent = "画像を探しています...";
      }
    };

    let animationStarted = false;

    /* STARTボタン（実機での確実な音声アンロック対応版） */
    startButton.addEventListener(
      "click",
      async () => {
        if (!mixer || !action || !clipDuration) {
          return;
        }

        startButton.disabled = true;

        try {
          console.log("① STARTクリック");

          // 1. AudioContextの強制復帰（スマホ対策）
          if (audioContext.state === "suspended") {
            await audioContext.resume();
          }
          console.log("② AudioContext状態:", audioContext.state);

          // 2. スマホのブラウザ制限を突破するため、全SEを「無音（Gain=0）」で一瞬だけ再生して経路を完全にこじ開ける
          try {
            playSound(seiBuffer, 0);
            playSound(paBuffer, 0);
            playSound(meeeBuffer, 0);
// BGMの仮再生を無音にしてアンロック
const originalGain = bgmGain.gain.value;

bgmGain.gain.cancelScheduledValues(audioContext.currentTime);
bgmGain.gain.setValueAtTime(0, audioContext.currentTime);

try {
  await bgm.play();
} finally {
  bgm.pause();
  bgm.currentTime = 0;

  bgmGain.gain.cancelScheduledValues(audioContext.currentTime);
  bgmGain.gain.setValueAtTime(originalGain, audioContext.currentTime);
}

console.log("③ 音声エンジン・アンロック完了");
          } catch (e) {
            console.log("音声アンロック空打ち注意:", e);
          }

          // 3. MindAR起動
          console.log("④ MindAR起動開始");
          await mindarThree.start();
          console.log("⑤ MindAR起動完了");

          animationElapsed = 0;
          currentLoopIndex = -1;
          resetSEFlags();

          fadeOverlay.style.opacity = "0";

          mixer.setTime(0);
          action.reset();
          action.play();
          animationStarted = true;

          clock.start();

          startButton.style.display = "none";
          statusText.style.display = "none";

          /* =========================
             Animation Loop
          ========================= */
          renderer.setAnimationLoop(() => {
            const delta = clock.getDelta();
            animationElapsed += delta;

            // BGM停止判定
            if (bgmStopAt !== null && audioContext.currentTime >= bgmStopAt) {
              bgm.pause();
              bgm.currentTime = 0;
              bgmStopAt = null;
            }

            // ループ管理
            const loopIndex = Math.floor(animationElapsed / clipDuration);
            if (loopIndex !== currentLoopIndex) {
              currentLoopIndex = loopIndex;
              resetSEFlags();
              fadeOverlay.style.opacity = "0";
              startBGM(clipDuration);
            }

            const cycleTime = animationElapsed % clipDuration;
            mixer.setTime(cycleTime);

            /* ブラックアウト制御 */
            if (cycleTime >= BLACK_START) {
              const blackDuration = clipDuration - BLACK_START;
              const blackAlpha = THREE.MathUtils.clamp(
                (cycleTime - BLACK_START) / blackDuration,
                0,
                1
              );
              fadeOverlay.style.opacity = String(blackAlpha);
            } else {
              fadeOverlay.style.opacity = "0";
            }

            /* SE① セイッ！ */
            if (!seiPlayed && cycleTime >= SEI_TIME) {
              playSound(seiBuffer, SEI_GAIN);
              seiPlayed = true;
            }

            /* SE② パッ！ */
            if (!paPlayed && cycleTime >= PA_TIME + PA_OFFSET) {
              playSound(paBuffer, PA_GAIN);
              paPlayed = true;
            }

            /* SE③ メェェ～ */
            if (!meeePlayed && cycleTime >= MEEE_TIME) {
              playSound(meeeBuffer, MEEE_GAIN);
              meeePlayed = true;
            }

            renderer.render(scene, camera);
          });

        } catch (error) {
          console.error(error);
          statusText.style.display = "block";
          statusText.textContent = "開始エラー: " + error.message;
          startButton.disabled = false;
          startButton.style.display = "block";
        }
      }
    );

  } catch (error) {
    console.error(error);
    statusText.textContent = "ERROR: " + error.message;
  }
}

init();

</script>

</body>
</html>
